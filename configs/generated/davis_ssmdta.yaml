seed: 42
device: auto
data:
  name: davis
  root: data/davis
  smiles_file: smiles.csv
  sequence_file: sequence.csv
  affinity_file: affinity.csv
  drug_id_col: DRUGID
  smiles_col: SMILES
  target_id_col: TARGETID
  sequence_col: SEQUENCE
  label_col: VALUE
  max_smiles_len: 100
  max_protein_len: 512
  split:
    method: random
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
  num_workers: 0
  pin_memory: true
model:
  name: ssmdta
  input_mode: sequence
  embed_dim: 128
  encoder_layers: 2
  num_attention_heads: 4
  ffn_dim: 256
  cross_attention_heads: 4
  dropout: 0.1
  fc_dims:
  - 512
  - 256
train:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  early_stopping_patience: 10
  metric_for_best: rmse
  output_dir: outputs/davis_ssmdta
  amp: true
  amp_dtype: float16
  cudnn_benchmark: true
  checkpoint_interval: 5
evaluation:
  ci_higher_is_better: true
  save_predictions: true
